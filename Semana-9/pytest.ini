<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Sahara | Iniciar sesión</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/registro.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<header class="header">
    <div class="logo">
        <span class="logo-circle">A</span>
        <span>AL SAHARA</span>
    </div>
    <nav class="navbar">
        <a href="index.html">Inicio</a>
        <a href="menu.html">Menú</a>
        <a href="registro.html">Regístrate aquí</a>
        <a href="carrito.html">Carrito</a>
    </nav>
    <div class="header-actions">
        <a href="carrito.html" class="cart-button" aria-label="Carrito">🛒</a>
        <div id="auth-area"></div>
    </div>
</header>

<main class="login-page">
    <section class="login-card">
        <span class="register-eyebrow">LA MESA DEL SAHARA</span>
        <h1>Bienvenido de vuelta</h1>
        <p class="login-description">Inicia sesión para consultar tu cuenta, pedidos y contenido protegido.</p>

        <form id="login-form" class="register-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" autocomplete="username" required placeholder="ana">
            </div>

            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
            </div>

            <button type="submit" class="register-button">Iniciar sesión</button>
            <p id="login-message" class="login-message" role="alert"></p>
        </form>

        <p class="already-account">¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        <p class="login-hint">Para la demostración de la guía: <strong>ana / 1234</strong> o <strong>ernesto / admin123</strong>.</p>
    </section>
</main>


<script src="js/script.js"></script>
</body>
</html>
