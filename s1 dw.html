<!DOCTYPE html>
<html>
<head>

<style>

.navbar{
    background: rgb(231, 231, 231);
    text-align: center;
    padding: 20px;
}

.fila{
    display: grid;
    grid-template-columns: repeat(12,1fr);
    gap: 10px;
    margin-top: 10px;
}

.caja{
    border: 2px solid black;
    height: 100px;
    text-align: center;
    line-height: 100px;
}

.col3{
    grid-column: span 3;
    background: rgb(233, 67, 67);
}

.col6{
    grid-column: span 6;
    background: rgb(241, 81, 241);
}

.col4{
    grid-column: span 4;
    background: rgb(82, 82, 236);
}

</style>

</head>
<body>

<div class="navbar">
    Navbar
</div>

<div class="fila">
    <div class="caja col3">3</div>
    <div class="caja col6">6</div>
    <div class="caja col3">3</div>
</div>

<div class="fila">
    <div class="caja col4">4</div>
    <div class="caja col4">4</div>
    <div class="caja col4">4</div>
</div>

</body>
</html>
